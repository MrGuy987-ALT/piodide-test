<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PyLite Python IDE</title>

<!-- Pyodide -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>

<!-- Ace Editor -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ext-language_tools.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
}

body {
    background: #1e1e2e;
    color: #cdd6f4;
    font-family: Arial, sans-serif;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 58px;

    display: flex;
    align-items: center;

    padding: 0 15px;
    gap: 9px;

    background: #181825;
    border-bottom: 1px solid #313244;
}

.logo {
    margin-right: auto;

    font-size: 19px;
    font-weight: 700;

    color: #89b4fa;
}

.status {
    margin-right: 7px;

    font-size: 12px;
    color: #6c7086;
}

button {
    border: 0;
    border-radius: 6px;

    padding: 8px 15px;

    font-weight: 600;

    cursor: pointer;

    background: #89b4fa;
    color: #11111b;
}

button:hover {
    background: #b4befe;
}

button:disabled {
    opacity: 0.45;
    cursor: default;
}

.stop {
    background: #f38ba8;
}

.stop:hover {
    background: #eba0ac;
}

.clear {
    background: #313244;
    color: #cdd6f4;
}

.clear:hover {
    background: #45475a;
}


/* =========================
   MAIN
========================= */

.workspace {
    height: calc(100vh - 58px);

    display: grid;
    grid-template-columns: 1fr 1fr;
}

.panel {
    min-width: 0;
    min-height: 0;

    display: flex;
    flex-direction: column;
}

.panel + .panel {
    border-left: 1px solid #313244;
}

.panel-header {
    height: 39px;

    flex-shrink: 0;

    display: flex;
    align-items: center;

    padding: 0 14px;

    background: #181825;
    border-bottom: 1px solid #313244;

    color: #7f849c;

    font-size: 11px;
    font-weight: 600;

    text-transform: uppercase;
    letter-spacing: 0.8px;
}


/* =========================
   ACE
========================= */

#editor {
    flex: 1;

    width: 100%;
    height: 100%;
}


/* =========================
   CONSOLE
========================= */

.console-wrapper {
    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;

    background: #11111b;
}

#console {
    flex: 1;

    min-height: 0;

    padding: 14px 16px;

    overflow-y: auto;

    font-family:
        "Cascadia Code",
        "Fira Code",
        Consolas,
        monospace;

    font-size: 14px;
    line-height: 1.55;

    white-space: pre-wrap;
    word-break: break-word;
}

.console-line {
    white-space: pre-wrap;
}

.normal {
    color: #cdd6f4;
}

.system {
    color: #6c7086;
}

.error {
    color: #f38ba8;
}

.prompt {
    color: #89b4fa;
}

.input-output {
    color: #a6e3a1;
}


/* =========================
   INPUT
========================= */

.input-area {
    display: none;

    padding: 9px 13px;

    border-top: 1px solid #313244;

    background: #181825;
}

.input-row {
    display: flex;
    align-items: center;

    gap: 9px;
}

.input-prompt {
    color: #89b4fa;

    font-family:
        "Cascadia Code",
        Consolas,
        monospace;

    font-size: 14px;

    white-space: nowrap;
}

#consoleInput {
    flex: 1;

    min-width: 0;

    padding: 7px 9px;

    border: 1px solid #45475a;
    border-radius: 5px;

    outline: none;

    background: #11111b;
    color: #a6e3a1;

    font-family:
        "Cascadia Code",
        Consolas,
        monospace;

    font-size: 14px;
}

#consoleInput:focus {
    border-color: #89b4fa;
}


/* =========================
   RESIZER
========================= */

.resizer {
    width: 4px;

    position: absolute;

    top: 58px;
    bottom: 0;

    left: 50%;

    transform: translateX(-2px);

    z-index: 50;

    cursor: col-resize;
}

.resizer:hover {
    background: #89b4fa;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 800px) {

    body {
        overflow: auto;
    }

    .workspace {
        height: calc(100vh - 58px);

        grid-template-columns: 1fr;
        grid-template-rows: 1fr 1fr;
    }

    .panel + .panel {
        border-left: 0;
        border-top: 1px solid #313244;
    }

    .resizer {
        display: none;
    }

    .status {
        display: none;
    }
}
</style>
</head>


<body>

<!-- =========================
     HEADER
========================= -->

<header class="topbar">

    <div class="logo">
        PyLite
    </div>

    <div
        class="status"
        id="status"
    >
        Loading Python...
    </div>

    <button
        id="runButton"
        disabled
    >
        Run
    </button>

    <button
        id="stopButton"
        class="stop"
        disabled
    >
        Stop
    </button>

    <button
        id="clearButton"
        class="clear"
    >
        Clear
    </button>

</header>


<!-- =========================
     MAIN
========================= -->

<main class="workspace">

    <!-- EDITOR -->

    <section class="panel">

        <div class="panel-header">
            Python
        </div>

        <div id="editor"></div>

    </section>


    <!-- CONSOLE -->

    <section class="panel">

        <div class="panel-header">
            Console
        </div>

        <div class="console-wrapper">

            <div id="console"></div>

            <div
                class="input-area"
                id="inputArea"
            >

                <div class="input-row">

                    <span
                        class="input-prompt"
                        id="inputPrompt"
                    >
                        &gt;&gt;&gt;
                    </span>

                    <input
                        id="consoleInput"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>

            </div>

        </div>

    </section>

</main>


<script>

/* =========================================================
   GLOBALS
========================================================= */

let pyodide = null;

let editor = null;

let running = false;

let executionId = 0;

let inputResolver = null;


/* =========================================================
   ELEMENTS
========================================================= */

const consoleElement =
    document.getElementById("console");

const consoleInput =
    document.getElementById("consoleInput");

const inputArea =
    document.getElementById("inputArea");

const inputPrompt =
    document.getElementById("inputPrompt");

const runButton =
    document.getElementById("runButton");

const stopButton =
    document.getElementById("stopButton");

const clearButton =
    document.getElementById("clearButton");

const status =
    document.getElementById("status");


/* =========================================================
   CUSTOM TOKYO-NIGHT-LIKE ACE THEME
========================================================= */

ace.define(
    "ace/theme/pylite",
    [
        "require",
        "exports",
        "module",
        "ace/lib/dom"
    ],
    function(
        require,
        exports,
        module
    ) {

        exports.isDark = true;

        exports.cssClass =
            "ace-pylite";

        exports.cssText = `

            .ace-pylite
                {
                    background-color: #1e1e2e;
                    color: #cdd6f4;
                }

            .ace-pylite
                .ace_gutter
                {
                    background: #181825;
                    color: #585b70;
                }

            .ace-pylite
                .ace_print-margin
                {
                    width: 1px;
                    background: #313244;
                }

            .ace-pylite
                .ace_cursor
                {
                    color: #f5e0e0;
                }

            .ace-pylite
                .ace_marker-layer
                .ace_selection
                {
                    background: #45475a;
                }

            .ace-pylite
                .ace_marker-layer
                .ace_active-line
                {
                    background: #242435;
                }

            .ace-pylite
                .ace_gutter-active-line
                {
                    background: #242435;
                    color: #cdd6f4;
                }

            .ace-pylite
                .ace_keyword
                {
                    color: #cba6f7;
                }

            .ace-pylite
                .ace_keyword.ace_operator
                {
                    color: #89dceb;
                }

            .ace-pylite
                .ace_constant
                {
                    color: #fab387;
                }

            .ace-pylite
                .ace_constant.ace_numeric
                {
                    color: #fab387;
                }

            .ace-pylite
                .ace_string
                {
                    color: #a6e3a1;
                }

            .ace-pylite
                .ace_comment
                {
                    color: #6c7086;
                    font-style: italic;
                }

            .ace-pylite
                .ace_support.ace_function
                {
                    color: #89b4fa;
                }

            .ace-pylite
                .ace_entity.ace_name.ace_function
                {
                    color: #89b4fa;
                }

            .ace-pylite
                .ace_support.ace_class
                {
                    color: #f9e2af;
                }

            .ace-pylite
                .ace_entity.ace_name.ace_class
                {
                    color: #f9e2af;
                }

            .ace-pylite
                .ace_variable
                {
                    color: #cdd6f4;
                }

            .ace-pylite
                .ace_variable.ace_parameter
                {
                    color: #f2cdcd;
                }

            .ace-pylite
                .ace_meta
                {
                    color: #f9e2af;
                }

            .ace-pylite
                .ace_invalid
                {
                    color: #f38ba8;
                    background-color: transparent;
                }

            .ace-pylite
                .ace_paren
                {
                    color: #89b4fa;
                }

        `;

        const dom =
            require("ace/lib/dom");

        dom.importCssString(
            exports.cssText,
            exports.cssClass
        );
    }
);


/* =========================================================
   CREATE EDITOR
========================================================= */

editor = ace.edit("editor");

editor.setTheme(
    "ace/theme/pylite"
);

editor.session.setMode(
    "ace/mode/python"
);


/* Editor settings */

editor.setOptions({

    fontSize: "15px",

    showPrintMargin: false,

    showFoldWidgets: true,

    displayIndentGuides: true,

    highlightActiveLine: true,

    highlightSelectedWord: true,

    tabSize: 4,

    useSoftTabs: true,

    enableBasicAutocompletion: true,

    enableLiveAutocompletion: true,

    enableSnippets: true,

    behavioursEnabled: true,

    wrap: false

});


editor.session.setUseSoftTabs(true);

editor.session.setTabSize(4);


/* =========================================================
   AUTOCOMPLETION
========================================================= */

const pythonKeywords = [

    "and",
    "as",
    "assert",
    "async",
    "await",
    "break",
    "case",
    "class",
    "continue",
    "def",
    "del",
    "elif",
    "else",
    "except",
    "finally",
    "for",
    "from",
    "global",
    "if",
    "import",
    "in",
    "is",
    "lambda",
    "match",
    "None",
    "nonlocal",
    "not",
    "or",
    "pass",
    "raise",
    "return",
    "True",
    "try",
    "type",
    "while",
    "with",
    "yield"

];


const pythonBuiltins = [

    "abs",
    "all",
    "any",
    "ascii",
    "bin",
    "bool",
    "breakpoint",
    "bytearray",
    "bytes",
    "callable",
    "chr",
    "classmethod",
    "compile",
    "complex",
    "delattr",
    "dict",
    "dir",
    "divmod",
    "enumerate",
    "eval",
    "exec",
    "filter",
    "float",
    "format",
    "frozenset",
    "getattr",
    "globals",
    "hasattr",
    "hash",
    "help",
    "hex",
    "id",
    "input",
    "int",
    "isinstance",
    "issubclass",
    "iter",
    "len",
    "list",
    "locals",
    "map",
    "max",
    "memoryview",
    "min",
    "next",
    "object",
    "oct",
    "open",
    "ord",
    "pow",
    "print",
    "property",
    "range",
    "repr",
    "reversed",
    "round",
    "set",
    "setattr",
    "slice",
    "sorted",
    "staticmethod",
    "str",
    "sum",
    "super",
    "tuple",
    "type",
    "vars",
    "zip"

];


const pythonModules = [

    "math",
    "random",
    "datetime",
    "json",
    "os",
    "sys",
    "time",
    "statistics",
    "re",
    "collections",
    "itertools",
    "functools",
    "decimal",
    "fractions",
    "pathlib",
    "string"

];


const pythonTypes = [

    "int",
    "float",
    "str",
    "bool",
    "list",
    "tuple",
    "dict",
    "set",
    "bytes",
    "complex",
    "object",
    "Exception",
    "ValueError",
    "TypeError",
    "IndexError",
    "KeyError",
    "RuntimeError"

];


/*
 * Custom Python completer.
 */

const pythonCompleter = {

    identifierRegexps: [
        /[a-zA-Z_][a-zA-Z0-9_]*/
    ],

    getCompletions:
        function(
            editor,
            session,
            pos,
            prefix,
            callback
        ) {

            const completions = [];


            pythonKeywords.forEach(
                word => {

                    completions.push({

                        caption: word,

                        value: word,

                        meta: "keyword",

                        score: 900

                    });

                }
            );


            pythonBuiltins.forEach(
                word => {

                    completions.push({

                        caption: word,

                        value: word,

                        meta: "builtin",

                        score: 800

                    });

                }
            );


            pythonModules.forEach(
                word => {

                    completions.push({

                        caption: word,

                        value: word,

                        meta: "module",

                        score: 700

                    });

                }
            );


            pythonTypes.forEach(
                word => {

                    completions.push({

                        caption: word,

                        value: word,

                        meta: "type",

                        score: 750

                    });

                }
            );


            /*
             * Add variables and functions
             * already present in the editor.
             */

            const code =
                editor.getValue();


            const variableMatches =
                code.matchAll(
                    /\b(?:def|class)\s+([A-Za-z_]\w*)/g
                );


            for (
                const match of variableMatches
            ) {

                completions.push({

                    caption: match[1],

                    value: match[1],

                    meta: "defined",

                    score: 950

                });

            }


            const assignmentMatches =
                code.matchAll(
                    /\b([A-Za-z_]\w*)\s*=/g
                );


            for (
                const match of assignmentMatches
            ) {

                completions.push({

                    caption: match[1],

                    value: match[1],

                    meta: "variable",

                    score: 850

                });

            }


            callback(
                null,
                completions
            );

        }

};


/*
 * Register completer.
 */

const langTools =
    ace.require(
        "ace/ext/language_tools"
    );

langTools.addCompleter(
    pythonCompleter
);


/* =========================================================
   CONSOLE
========================================================= */

function clearConsole() {

    consoleElement.innerHTML = "";

}


function writeConsole(
    text,
    type = "normal"
) {

    const line =
        document.createElement("div");

    line.className =
        "console-line " +
        type;

    line.textContent =
        text;

    consoleElement.appendChild(
        line
    );

    consoleElement.scrollTop =
        consoleElement.scrollHeight;

}


function writeConsoleLine(
    text = "",
    type = "normal"
) {

    writeConsole(
        text,
        type
    );

}


/* =========================================================
   INPUT
========================================================= */

function requestInput(
    promptText
) {

    return new Promise(
        resolve => {

            inputResolver =
                resolve;

            inputPrompt.textContent =
                promptText || ">>>";

            inputArea.style.display =
                "block";

            consoleInput.value =
                "";

            consoleInput.focus();

        }
    );

}


function finishInput() {

    inputArea.style.display =
        "none";

}


consoleInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Enter"
        ) {
            return;
        }


        const value =
            consoleInput.value;


        writeConsole(
            value,
            "input-output"
        );


        finishInput();


        if (
            inputResolver
        ) {

            const resolver =
                inputResolver;

            inputResolver =
                null;

            resolver(value);

        }

    }
);


/* =========================================================
   PYODIDE
========================================================= */

async function loadPython() {

    try {

        status.textContent =
            "Loading Python...";


        pyodide =
            await loadPyodide();


        /*
         * stdout
         */

        pyodide.setStdout({

            batched(text) {

                writeConsole(
                    text,
                    "normal"
                );

            }

        });


        /*
         * stderr
         */

        pyodide.setStderr({

            batched(text) {

                writeConsole(
                    text,
                    "error"
                );

            }

        });


        /*
         * Expose JavaScript input
         * function to Python.
         */

        window.pyLiteInput =
            requestInput;


        /*
         * Import the JavaScript
         * bridge into Python.
         */

        await pyodide.runPythonAsync(`

from js import pyLiteInput

        `);


        status.textContent =
            "Python 3 • Ready";


        runButton.disabled =
            false;


        writeConsoleLine(
            "Python 3 loaded.",
            "system"
        );

        writeConsoleLine(
            "Ctrl + Enter to run.",
            "system"
        );


    } catch (error) {

        status.textContent =
            "Python failed to load";


        writeConsoleLine(
            String(error),
            "error"
        );

    }

}


/* =========================================================
   INPUT TRANSFORMATION
========================================================= */

/*
 * Python's normal input() is synchronous,
 * while the browser cannot synchronously
 * wait for keyboard input without freezing
 * the entire page.
 *
 * We therefore transform input(...)
 * into await pyLiteInput(...).
 */

function transformInput(
    code
) {

    /*
     * This handles common input() usage.
     *
     * Example:
     *
     * name = input("Name: ")
     *
     * becomes:
     *
     * name = await pyLiteInput("Name: ")
     */

    let transformed =
        code.replace(
            /\binput\s*\(/g,
            "await pyLiteInput("
        );


    /*
     * runPythonAsync supports top-level
     * await in Pyodide.
     */

    return transformed;

}


/* =========================================================
   RUN
========================================================= */

async function runPython() {

    if (
        !pyodide ||
        running
    ) {

        return;

    }


    /*
     * Clear console EVERY time
     * Run is pressed.
     */

    clearConsole();


    finishInput();


    running = true;


    const currentExecution =
        ++executionId;


    runButton.disabled =
        true;

    stopButton.disabled =
        false;


    writeConsoleLine(
        ">>> Running...",
        "system"
    );


    const code =
        editor.getValue();


    const start =
        performance.now();


    try {

        const transformed =
            transformInput(code);


        await pyodide.runPythonAsync(
            transformed
        );


        if (
            currentExecution !==
            executionId
        ) {

            return;

        }


        const elapsed =
            (
                performance.now() -
                start
            ).toFixed(2);


        writeConsoleLine(
            "",
            "normal"
        );


        writeConsoleLine(
            `>>> Finished in ${elapsed} ms`,
            "system"
        );


    } catch (error) {

        if (
            currentExecution ===
            executionId
        ) {

            writeConsoleLine(
                "",
                "normal"
            );


            writeConsoleLine(
                String(error),
                "error"
            );

        }

    } finally {

        if (
            currentExecution ===
            executionId
        ) {

            running = false;

            runButton.disabled =
                false;

            stopButton.disabled =
                true;

        }

    }

}


/* =========================================================
   STOP
========================================================= */

function stopPython() {

    executionId++;

    running = false;


    finishInput();


    runButton.disabled =
        false;

    stopButton.disabled =
        true;


    writeConsoleLine(
        "",
        "normal"
    );


    writeConsoleLine(
        ">>> Execution stopped.",
        "error"
    );

}


runButton.addEventListener(
    "click",
    runPython
);


stopButton.addEventListener(
    "click",
    stopPython
);


clearButton.addEventListener(
    "click",
    clearConsole
);


/* =========================================================
   KEYBOARD SHORTCUTS
========================================================= */

editor.commands.addCommand({

    name: "runPython",

    bindKey: {
        win: "Ctrl-Enter",
        mac: "Command-Enter"
    },

    exec: function() {

        runPython();

    }

});


editor.commands.addCommand({

    name: "clearConsole",

    bindKey: {
        win: "Ctrl-L",
        mac: "Command-L"
    },

    exec: function() {

        clearConsole();

    }

});


/* =========================================================
   INITIAL CODE
========================================================= */

editor.setValue(
`print("Hello, world!")

name = input("What is your name? ")

print("Hello,", name)

for i in range(5):
    print("Number:", i)
`,
    -1
);


/* =========================================================
   START
========================================================= */

loadPython();

</script>

</body>
</html>
