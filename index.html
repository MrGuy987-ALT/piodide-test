<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/x-icon" href="images/python.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet"
    >

    <title>PyLite</title>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ext-language_tools.min.js"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
        }

        body {
            background: #1a1b26;
            color: #c0caf5;
            font-family: "Nunito", "Quicksand", sans-serif;
        }

        /* =========================================================
           TOP BAR
        ========================================================= */

        .topbar {
            height: 56px;

            display: flex;
            align-items: center;

            gap: 8px;

            padding: 0 14px;

            background: #16161e;

            border-bottom: 1px solid #292e42;
        }

        .logo {
            margin-right: auto;

            color: #7aa2f7;

            font-size: 19px;
            font-weight: bold;
        }

        .status {
            color: #565f89;

            font-size: 12px;

            margin-right: 8px;
        }

        button {
            border: 0;
            border-radius: 6px;

            padding: 8px 14px;

            background: #7aa2f7;

            color: #16161e;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #89b4fa;
        }

        button:disabled {
            opacity: .45;
            cursor: default;
        }

        .stop {
            background: #f7768e;
        }

        .stop:hover {
            background: #ff899d;
        }

        .clear {
            background: #292e42;
            color: #c0caf5;
        }

        .clear:hover {
            background: #414868;
        }

        /* =========================================================
           WORKSPACE
        ========================================================= */

        .workspace {
            height: calc(100vh - 56px);

            display: grid;

            grid-template-columns: 1fr 1fr;
        }

        .panel {
            min-width: 0;
            min-height: 0;

            display: flex;
            flex-direction: column;
        }

        .panel + .panel {
            border-left: 1px solid #292e42;
        }

        /* =========================================================
           PANEL HEADER
        ========================================================= */

        .panel-header {
            height: 38px;

            flex-shrink: 0;

            display: flex;
            align-items: center;

            padding: 0 14px;

            background: #16161e;

            border-bottom: 1px solid #292e42;

            color: #565f89;

            font-size: 11px;

            font-weight: bold;

            letter-spacing: .8px;

            text-transform: uppercase;
        }

        /* =========================================================
           EDITOR
        ========================================================= */

        #editor {
            flex: 1;

            width: 100%;
            height: 100%;
        }

        /* =========================================================
           RIGHT SIDE
        ========================================================= */

        .right-panel {
            min-height: 0;

            display: flex;
            flex-direction: column;
        }

        /* =========================================================
           TABS
        ========================================================= */

        .tabs {
            height: 40px;

            flex-shrink: 0;

            display: flex;

            background: #16161e;

            border-bottom: 1px solid #292e42;
        }

        .tab {
            display: flex;
            align-items: center;

            padding: 0 15px;

            color: #565f89;

            font-size: 12px;

            cursor: pointer;

            border-right: 1px solid #292e42;
        }

        .tab:hover {
            color: #c0caf5;
            background: #1a1b26;
        }

        .tab.active {
            color: #7aa2f7;

            background: #1a1b26;

            border-bottom: 2px solid #7aa2f7;
        }

        /* =========================================================
           VIEWS
        ========================================================= */

        .view {
            display: none;

            flex: 1;

            min-height: 0;
        }

        .view.active {
            display: flex;
        }

        /* =========================================================
           CONSOLE
        ========================================================= */

        .console-view {
            flex-direction: column;

            background: #101014;
        }

        #console {
            flex: 1;

            min-height: 0;

            padding: 14px 16px;

            overflow-y: auto;

            white-space: pre-wrap;

            word-break: break-word;

            font-family:
                "Cascadia Code",
                "Fira Code",
                Consolas,
                monospace;

            font-size: 14px;

            line-height: 1.55;
        }

        .console-line {
            white-space: pre-wrap;
        }

        .normal {
            color: #c0caf5;
        }

        .system {
            color: #565f89;
        }

        .error {
            color: #f7768e;
        }

        .input-output {
            color: #9ece6a;
        }

        /* =========================================================
           CONSOLE INPUT
        ========================================================= */

        .input-area {
            display: none;

            padding: 9px 13px;

            background: #16161e;

            border-top: 1px solid #292e42;
        }

        .input-row {
            display: flex;

            align-items: center;

            gap: 8px;
        }

        .input-prompt {
            color: #7aa2f7;

            font-family:
                "Cascadia Code",
                Consolas,
                monospace;
        }

        #consoleInput {
            flex: 1;

            min-width: 0;

            padding: 7px 9px;

            border: 1px solid #414868;

            border-radius: 5px;

            outline: none;

            background: #101014;

            color: #9ece6a;

            font-family:
                "Cascadia Code",
                Consolas,
                monospace;

            font-size: 14px;
        }

        #consoleInput:focus {
            border-color: #7aa2f7;
        }

        /* =========================================================
           TURTLE
        ========================================================= */

        .turtle-view {
            position: relative;

            align-items: center;
            justify-content: center;

            background: #101014;
        }

        .turtle-stage {
            position: relative;

            width: 700px;
            height: 500px;

            max-width: 95%;
            max-height: 95%;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .45);
        }

        .turtle-stage canvas {
            position: absolute;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;
        }

        #turtleDrawingCanvas {
            background: white;
        }

        #turtleCanvas {
            pointer-events: none;
        }

        /* =========================================================
           CANVAS
        ========================================================= */

        .canvas-view {
            position: relative;

            align-items: center;
            justify-content: center;

            background: #101014;
        }

        #pythonCanvas {
            max-width: 95%;
            max-height: 95%;

            background: white;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, .45);
        }

        /* =========================================================
           WEB
        ========================================================= */

        .web-view {
            background: white;
        }

        #webFrame {
            width: 100%;
            height: 100%;

            border: 0;
        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 800px) {

            body {
                overflow: auto;
            }

            .workspace {
                height: calc(100vh - 56px);

                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }

            .panel + .panel {
                border-left: 0;
                border-top: 1px solid #292e42;
            }

            .status {
                display: none;
            }

        }

    </style>
</head>

<body>

    <!-- =========================================================
         HEADER
    ========================================================= -->

    <header class="topbar">

        <div class="logo">
            PyLite
        </div>

        <div
            class="status"
            id="status"
        >
            Loading Python...
        </div>

        <button
            id="runButton"
            disabled
        >
            Run
        </button>

        <button
            id="stopButton"
            class="stop"
            disabled
        >
            Stop
        </button>

        <button
            id="clearButton"
            class="clear"
        >
            Clear
        </button>

    </header>


    <!-- =========================================================
         MAIN
    ========================================================= -->

    <main class="workspace">

        <!-- =====================================================
             EDITOR
        ====================================================== -->

        <section class="panel">

            <div class="panel-header">
                Python
            </div>

            <div id="editor"></div>

        </section>


        <!-- =====================================================
             OUTPUT
        ====================================================== -->

        <section class="panel right-panel">

            <!-- =================================================
                 TABS
            ================================================== -->

            <div class="tabs">

                <div
                    class="tab active"
                    data-view="consoleView"
                >
                    Console
                </div>

                <div
                    class="tab"
                    data-view="turtleView"
                >
                    Turtle
                </div>

                <div
                    class="tab"
                    data-view="canvasView"
                >
                    Canvas
                </div>

                <div
                    class="tab"
                    data-view="webView"
                >
                    Web
                </div>

            </div>


            <!-- =================================================
                 CONSOLE
            ================================================== -->

            <div
                class="view console-view active"
                id="consoleView"
            >

                <div id="console"></div>

                <div
                    class="input-area"
                    id="inputArea"
                >

                    <div class="input-row">

                        <span
                            class="input-prompt"
                            id="inputPrompt"
                        >
                            &gt;&gt;&gt;
                        </span>

                        <input
                            id="consoleInput"
                            autocomplete="off"
                            spellcheck="false"
                        >

                    </div>

                </div>

            </div>


            <!-- =================================================
                 TURTLE
            ================================================== -->

            <div
                class="view turtle-view"
                id="turtleView"
            >

                <div class="turtle-stage">

                    <canvas
                        id="turtleDrawingCanvas"
                        width="700"
                        height="500"
                    ></canvas>

                    <canvas
                        id="turtleCanvas"
                        width="700"
                        height="500"
                    ></canvas>

                </div>

            </div>


            <!-- =================================================
                 CANVAS
            ================================================== -->

            <div
                class="view canvas-view"
                id="canvasView"
            >

                <canvas
                    id="pythonCanvas"
                    width="700"
                    height="500"
                ></canvas>

            </div>


            <!-- =================================================
                 WEB
            ================================================== -->

            <div
                class="view web-view"
                id="webView"
            >

                <iframe
                    id="webFrame"
                    sandbox="allow-scripts"
                ></iframe>

            </div>

        </section>

    </main>


    <script>

        /* =========================================================
           GLOBALS
        ========================================================= */

        let pyodide = null;
        let editor = null;

        let running = false;
        let executionID = 0;

        let inputResolver = null;


        /* =========================================================
           DOM
        ========================================================= */

        const consoleElement =
            document.getElementById("console");

        const consoleInput =
            document.getElementById("consoleInput");

        const inputArea =
            document.getElementById("inputArea");

        const inputPrompt =
            document.getElementById("inputPrompt");

        const runButton =
            document.getElementById("runButton");

        const stopButton =
            document.getElementById("stopButton");

        const clearButton =
            document.getElementById("clearButton");

        const status =
            document.getElementById("status");


        /* =========================================================
           TABS
        ========================================================= */

        document
            .querySelectorAll(".tab")
            .forEach(tab => {

                tab.addEventListener("click", () => {

                    document
                        .querySelectorAll(".tab")
                        .forEach(t => {
                            t.classList.remove("active");
                        });

                    document
                        .querySelectorAll(".view")
                        .forEach(v => {
                            v.classList.remove("active");
                        });

                    tab.classList.add("active");

                    document
                        .getElementById(tab.dataset.view)
                        .classList.add("active");

                });

            });


        /* =========================================================
           ACE EDITOR THEME
        ========================================================= */

        ace.define(
            "ace/theme/pylite",
            [
                "require",
                "exports",
                "module"
            ],
            function(
                require,
                exports
            ) {

                exports.isDark = true;

                exports.cssClass =
                    "ace-pylite";

                exports.cssText = `

                    .ace-pylite {
                        background: #1a1b26;
                        color: #c0caf5;
                    }

                    .ace-pylite .ace_gutter {
                        background: #16161e;
                        color: #565f89;
                    }

                    .ace-pylite .ace_print-margin {
                        background: #292e42;
                    }

                    .ace-pylite .ace_cursor {
                        color: #c0caf5;
                    }

                    .ace-pylite
                    .ace_marker-layer
                    .ace_selection {
                        background: #33467c;
                    }

                    .ace-pylite
                    .ace_marker-layer
                    .ace_active-line {
                        background: #1f2335;
                    }

                    .ace-pylite
                    .ace_gutter-active-line {
                        background: #1f2335;
                        color: #c0caf5;
                    }

                    .ace-pylite .ace_keyword {
                        color: #bb9af7;
                    }

                    .ace-pylite
                    .ace_keyword.ace_operator {
                        color: #89ddff;
                    }

                    .ace-pylite .ace_constant {
                        color: #ff9e64;
                    }

                    .ace-pylite
                    .ace_constant.ace_numeric {
                        color: #ff9e64;
                    }

                    .ace-pylite .ace_string {
                        color: #9ece6a;
                    }

                    .ace-pylite .ace_comment {
                        color: #565f89;
                        font-style: italic;
                    }

                    .ace-pylite
                    .ace_support.ace_function {
                        color: #7aa2f7;
                    }

                    .ace-pylite
                    .ace_entity.ace_name.ace_function {
                        color: #7aa2f7;
                    }

                    .ace-pylite
                    .ace_support.ace_class {
                        color: #e0af68;
                    }

                    .ace-pylite
                    .ace_entity.ace_name.ace_class {
                        color: #e0af68;
                    }

                    .ace-pylite .ace_variable {
                        color: #c0caf5;
                    }

                    .ace-pylite
                    .ace_variable.ace_parameter {
                        color: #f7768e;
                    }

                    .ace-pylite .ace_meta {
                        color: #e0af68;
                    }

                    .ace-pylite .ace_invalid {
                        color: #f7768e;
                    }

                `;

                require("ace/lib/dom").importCssString(
                    exports.cssText,
                    exports.cssClass
                );

            }
        );


        /* =========================================================
           ACE EDITOR
        ========================================================= */

        editor = ace.edit("editor");

        editor.setTheme(
            "ace/theme/pylite"
        );

        editor.session.setMode(
            "ace/mode/python"
        );

        editor.setOptions({

            fontSize: "15px",

            showPrintMargin: false,

            showFoldWidgets: true,

            displayIndentGuides: true,

            highlightActiveLine: true,

            highlightSelectedWord: true,

            tabSize: 4,

            useSoftTabs: true,

            enableBasicAutocompletion: true,

            enableLiveAutocompletion: true,

            enableSnippets: true,

            behavioursEnabled: true,

            wrap: false

        });


        /* =========================================================
           AUTOCOMPLETE
        ========================================================= */

        const pythonWords = [

            "and",
            "as",
            "assert",
            "async",
            "await",
            "break",
            "class",
            "continue",
            "def",
            "del",
            "elif",
            "else",
            "except",
            "False",
            "finally",
            "for",
            "from",
            "global",
            "if",
            "import",
            "in",
            "is",
            "lambda",
            "None",
            "not",
            "or",
            "pass",
            "raise",
            "return",
            "True",
            "try",
            "while",
            "with",
            "yield",

            "abs",
            "all",
            "any",
            "bool",
            "dict",
            "enumerate",
            "filter",
            "float",
            "input",
            "int",
            "len",
            "list",
            "map",
            "max",
            "min",
            "open",
            "print",
            "range",
            "round",
            "set",
            "sorted",
            "str",
            "sum",
            "tuple",
            "type",
            "zip",

            "math",
            "random",
            "datetime",
            "json",
            "os",
            "sys",
            "time",
            "turtle"

        ];


        const pythonCompleter = {

            getCompletions:
                function(
                    editor,
                    session,
                    pos,
                    prefix,
                    callback
                ) {

                    const results = [];

                    pythonWords.forEach(word => {

                        results.push({

                            caption: word,

                            value: word,

                            meta: "python",

                            score: 1000

                        });

                    });


                    const code =
                        editor.getValue();


                    const definitions =
                        code.matchAll(
                            /\b(?:def|class)\s+([A-Za-z_]\w*)/g
                        );


                    for (const match of definitions) {

                        results.push({

                            caption: match[1],

                            value: match[1],

                            meta: "defined",

                            score: 1200

                        });

                    }


                    const variables =
                        code.matchAll(
                            /\b([A-Za-z_]\w*)\s*=/g
                        );


                    for (const match of variables) {

                        results.push({

                            caption: match[1],

                            value: match[1],

                            meta: "variable",

                            score: 1100

                        });

                    }


                    callback(
                        null,
                        results
                    );

                }

        };


        const langTools =
            ace.require(
                "ace/ext/language_tools"
            );


        langTools.addCompleter(
            pythonCompleter
        );


        /* =========================================================
           CONSOLE
        ========================================================= */

        function clearConsole() {

            consoleElement.innerHTML = "";

        }


        function writeConsole(
            text,
            type = "normal"
        ) {

            const line =
                document.createElement("div");

            line.className =
                "console-line " + type;

            line.textContent =
                text;

            consoleElement.appendChild(
                line
            );

            consoleElement.scrollTop =
                consoleElement.scrollHeight;

        }


        function writeConsoleLine(
            text = "",
            type = "normal"
        ) {

            writeConsole(
                text,
                type
            );

        }


        /* =========================================================
           INPUT
        ========================================================= */

        function requestInput(
            promptText
        ) {

            return new Promise(resolve => {

                inputResolver = resolve;

                inputPrompt.textContent =
                    String(promptText || ">>>");

                inputArea.style.display =
                    "block";

                consoleInput.value = "";

                consoleInput.focus();

            });

        }


        function finishInput() {

            inputArea.style.display =
                "none";

        }


        consoleInput.addEventListener(
            "keydown",
            event => {

                if (event.key !== "Enter") {
                    return;
                }

                const value =
                    consoleInput.value;

                writeConsole(
                    value,
                    "input-output"
                );

                finishInput();

                if (inputResolver) {

                    const resolve =
                        inputResolver;

                    inputResolver = null;

                    resolve(value);

                }

            }
        );


        /* =========================================================
           TURTLE CANVAS
        ========================================================= */

        const turtleDrawingCanvas =
            document.getElementById(
                "turtleDrawingCanvas"
            );

        const turtleDrawingCtx =
            turtleDrawingCanvas.getContext(
                "2d"
            );


        const turtleCanvas =
            document.getElementById(
                "turtleCanvas"
            );

        const turtleCtx =
            turtleCanvas.getContext(
                "2d"
            );


        /* =========================================================
           GENERAL CANVAS
        ========================================================= */

        const pythonCanvas =
            document.getElementById(
                "pythonCanvas"
            );

        const pythonCtx =
            pythonCanvas.getContext(
                "2d"
            );


        function clearPythonCanvas() {

            pythonCtx.clearRect(
                0,
                0,
                pythonCanvas.width,
                pythonCanvas.height
            );

            pythonCtx.fillStyle =
                "white";

            pythonCtx.fillRect(
                0,
                0,
                pythonCanvas.width,
                pythonCanvas.height
            );

        }


        clearPythonCanvas();


        /* =========================================================
           TURTLE ENGINE
        ========================================================= */

        class BrowserTurtle {

            constructor() {

                this.reset();

            }


            reset() {

                this.x =
                    turtleDrawingCanvas.width / 2;

                this.y =
                    turtleDrawingCanvas.height / 2;

                this.angle = 0;

                this.pen = true;

                this.colorValue =
                    "#000000";

                this.widthValue = 1;

                this.visible = true;

                this.speedValue = 0;


                turtleDrawingCtx.clearRect(
                    0,
                    0,
                    turtleDrawingCanvas.width,
                    turtleDrawingCanvas.height
                );


                turtleDrawingCtx.fillStyle =
                    "white";

                turtleDrawingCtx.fillRect(
                    0,
                    0,
                    turtleDrawingCanvas.width,
                    turtleDrawingCanvas.height
                );


                turtleCtx.clearRect(
                    0,
                    0,
                    turtleCanvas.width,
                    turtleCanvas.height
                );


                this.drawTurtle();

            }


            clearTurtleOverlay() {

                turtleCtx.clearRect(
                    0,
                    0,
                    turtleCanvas.width,
                    turtleCanvas.height
                );

            }


            drawTurtle() {

                this.clearTurtleOverlay();

                if (!this.visible) {
                    return;
                }

                turtleCtx.save();

                turtleCtx.translate(
                    this.x,
                    this.y
                );

                turtleCtx.rotate(
                    -this.angle *
                    Math.PI /
                    180
                );


                turtleCtx.beginPath();

                turtleCtx.moveTo(
                    16,
                    0
                );

                turtleCtx.lineTo(
                    -10,
                    -9
                );

                turtleCtx.lineTo(
                    -7,
                    0
                );

                turtleCtx.lineTo(
                    -10,
                    9
                );

                turtleCtx.closePath();


                turtleCtx.fillStyle =
                    "#7aa2f7";

                turtleCtx.fill();


                turtleCtx.strokeStyle =
                    "#16161e";

                turtleCtx.lineWidth =
                    1.5;

                turtleCtx.stroke();

                turtleCtx.restore();

            }


            forward(distance) {

                distance =
                    Number(distance);


                const radians =
                    this.angle *
                    Math.PI /
                    180;


                const nx =
                    this.x +
                    Math.cos(radians) *
                    distance;


                const ny =
                    this.y -
                    Math.sin(radians) *
                    distance;


                if (this.pen) {

                    turtleDrawingCtx.beginPath();

                    turtleDrawingCtx.moveTo(
                        this.x,
                        this.y
                    );

                    turtleDrawingCtx.lineTo(
                        nx,
                        ny
                    );

                    turtleDrawingCtx.strokeStyle =
                        this.colorValue;

                    turtleDrawingCtx.lineWidth =
                        this.widthValue;

                    turtleDrawingCtx.lineCap =
                        "round";

                    turtleDrawingCtx.stroke();

                }


                this.x = nx;

                this.y = ny;


                this.drawTurtle();

            }


            fd(distance) {

                this.forward(distance);

            }


            backward(distance) {

                this.forward(
                    -Number(distance)
                );

            }


            bk(distance) {

                this.backward(distance);

            }


            back(distance) {

                this.backward(distance);

            }


            left(degrees) {

                this.angle +=
                    Number(degrees);

                this.drawTurtle();

            }


            lt(degrees) {

                this.left(degrees);

            }


            right(degrees) {

                this.angle -=
                    Number(degrees);

                this.drawTurtle();

            }


            rt(degrees) {

                this.right(degrees);

            }


            penup() {

                this.pen = false;

            }


            pu() {

                this.penup();

            }


            pendown() {

                this.pen = true;

            }


            pd() {

                this.pendown();

            }


            goto(x, y) {

                if (y === undefined) {

                    y = x[1];

                    x = x[0];

                }


                x = Number(x);

                y = Number(y);


                const nx =
                    turtleDrawingCanvas.width / 2 +
                    x;


                const ny =
                    turtleDrawingCanvas.height / 2 -
                    y;


                if (this.pen) {

                    turtleDrawingCtx.beginPath();

                    turtleDrawingCtx.moveTo(
                        this.x,
                        this.y
                    );

                    turtleDrawingCtx.lineTo(
                        nx,
                        ny
                    );

                    turtleDrawingCtx.strokeStyle =
                        this.colorValue;

                    turtleDrawingCtx.lineWidth =
                        this.widthValue;

                    turtleDrawingCtx.lineCap =
                        "round";

                    turtleDrawingCtx.stroke();

                }


                this.x = nx;

                this.y = ny;


                this.drawTurtle();

            }


            setx(x) {

                this.goto(
                    Number(x),
                    this.gety()
                );

            }


            sety(y) {

                this.goto(
                    this.getx(),
                    Number(y)
                );

            }


            getx() {

                return (
                    this.x -
                    turtleDrawingCanvas.width / 2
                );

            }


            gety() {

                return (
                    turtleDrawingCanvas.height / 2 -
                    this.y
                );

            }


            xcor() {

                return this.getx();

            }


            ycor() {

                return this.gety();

            }


            home() {

                this.goto(
                    0,
                    0
                );

                this.angle = 0;

                this.drawTurtle();

            }


            circle(
                radius,
                extent = 360
            ) {

                radius =
                    Number(radius);

                extent =
                    Number(extent);


                const steps =
                    Math.max(
                        20,
                        Math.ceil(
                            Math.abs(extent) *
                            2
                        )
                    );


                const angleStep =
                    extent / steps;


                const circumference =
                    2 *
                    Math.PI *
                    Math.abs(radius);


                const distance =
                    circumference *
                    Math.abs(angleStep) /
                    360;


                for (
                    let i = 0;
                    i < steps;
                    i++
                ) {

                    this.left(
                        angleStep
                    );

                    this.forward(
                        distance
                    );

                }

            }


            color(value) {

                this.colorValue =
                    String(value);

            }


            pencolor(value) {

                this.colorValue =
                    String(value);

            }


            pensize(value) {

                this.widthValue =
                    Number(value);

            }


            width(value) {

                this.pensize(value);

            }


            clear() {

                turtleDrawingCtx.clearRect(
                    0,
                    0,
                    turtleDrawingCanvas.width,
                    turtleDrawingCanvas.height
                );


                turtleDrawingCtx.fillStyle =
                    "white";


                turtleDrawingCtx.fillRect(
                    0,
                    0,
                    turtleDrawingCanvas.width,
                    turtleDrawingCanvas.height
                );


                this.drawTurtle();

            }


            speed(value) {

                this.speedValue =
                    Number(value);

            }


            hideturtle() {

                this.visible = false;

                this.clearTurtleOverlay();

            }


            ht() {

                this.hideturtle();

            }


            showturtle() {

                this.visible = true;

                this.drawTurtle();

            }


            st() {

                this.showturtle();

            }

        }

                /\binput\s*\(/g,
                "_pylite_input("
            );

        }

        ========================================================= */

        function resetPythonTurtle() {

            try {

                pyodide.runPython(`

            }

            catch (error) {

                console.error(
                    "Failed to reset Python turtle:",
                    error
                );

        /* =========================================================
           RUN
        ========================================================= */

        async function runPython() {

            if (
                !pyodide ||
                running
            ) {

                return;

            }


            /* =====================================================
               CLEAN PREVIOUS RUN
            ===================================================== */

            clearConsole();

            finishInput();

            clearPythonCanvas();


            /*
             * Reset the JavaScript turtle.
             *
             * This completely clears the drawing and returns
             * the turtle to the centre.
             */

            browserTurtle.reset();


            /*
             * Reset the Python-side turtle object as well.
             *
             * This is important because the Python module
             * survives between executions.
             */

            resetPythonTurtle();


            running = true;

            executionID++;


            const currentID =
                executionID;


            runButton.disabled =
                true;

            stopButton.disabled =
                false;

                ">>> Running...",
                "system"
            );


            const code =
                editor.getValue();


            try {

                const transformed =
                    transformInput(code);


                /*
                 * IMPORTANT:
                 *
                 * Every run receives a completely new
                 * Python namespace.
                 *
                 * This means variables, functions and objects
                 * from the previous program do not leak
                 * into the next execution.
                 */

                const wrappedCode = `

async def __pylite_main__():

    pylite_globals = {
        "__name__": "__main__",
        "__builtins__": __builtins__
    }

    exec(
        compile(
            ${JSON.stringify(transformed)},
            "<editor>",
            "exec"
        ),
        pylite_globals,
        pylite_globals
    )
