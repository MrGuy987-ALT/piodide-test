<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/x-icon" href="images/python.png">
<title>PyLite Python IDE</title>

<!-- =========================================================
     PYODIDE
========================================================= -->

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.2/full/pyodide.js"></script>


<!-- =========================================================
     ACE EDITOR
========================================================= -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ace.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/ace/1.43.2/ext-language_tools.min.js"></script>


<style>

/* =========================================================
   GLOBAL
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {

    width: 100%;
    height: 100%;

    margin: 0;

    overflow: hidden;

}

body {

    background: #1e1e2e;

    color: #cdd6f4;

    font-family: Arial, sans-serif;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {

    height: 58px;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 0 15px;

    background: #181825;

    border-bottom: 1px solid #313244;

}

.logo {

    margin-right: auto;

    color: #89b4fa;

    font-size: 19px;

    font-weight: bold;

}

.status {

    color: #6c7086;

    font-size: 12px;

    margin-right: 8px;

}

button {

    border: 0;

    border-radius: 6px;

    padding: 8px 14px;

    background: #89b4fa;

    color: #11111b;

    font-weight: 600;

    cursor: pointer;

}

button:hover {

    background: #b4befe;

}

button:disabled {

    opacity: .45;

    cursor: default;

}

.stop {

    background: #f38ba8;

}

.stop:hover {

    background: #eba0ac;

}

.clear {

    background: #313244;

    color: #cdd6f4;

}

.clear:hover {

    background: #45475a;

}


/* =========================================================
   MAIN WORKSPACE
========================================================= */

.workspace {

    height: calc(100vh - 58px);

    display: grid;

    grid-template-columns: 1fr 1fr;

}

.panel {

    min-width: 0;

    min-height: 0;

    display: flex;

    flex-direction: column;

}

.panel + .panel {

    border-left: 1px solid #313244;

}


/* =========================================================
   PANEL HEADER
========================================================= */

.panel-header {

    height: 39px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 0 14px;

    background: #181825;

    border-bottom: 1px solid #313244;

    color: #7f849c;

    font-size: 11px;

    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: .8px;

}


/* =========================================================
   EDITOR
========================================================= */

#editor {

    flex: 1;

    width: 100%;

    height: 100%;

}


/* =========================================================
   RIGHT PANEL
========================================================= */

.right-panel {

    min-height: 0;

    display: flex;

    flex-direction: column;

}


/* =========================================================
   TABS
========================================================= */

.tabs {

    height: 40px;

    flex-shrink: 0;

    display: flex;

    align-items: stretch;

    background: #181825;

    border-bottom: 1px solid #313244;

}

.tab {

    padding: 0 15px;

    display: flex;

    align-items: center;

    color: #6c7086;

    font-size: 12px;

    cursor: pointer;

    border-right: 1px solid #313244;

}

.tab:hover {

    color: #cdd6f4;

    background: #1e1e2e;

}

.tab.active {

    color: #89b4fa;

    background: #1e1e2e;

    border-bottom: 2px solid #89b4fa;

}


/* =========================================================
   VIEWS
========================================================= */

.view {

    display: none;

    flex: 1;

    min-height: 0;

}

.view.active {

    display: flex;

}


/* =========================================================
   CONSOLE
========================================================= */

.console-view {

    flex-direction: column;

    background: #11111b;

}

#console {

    flex: 1;

    min-height: 0;

    padding: 14px 16px;

    overflow-y: auto;

    font-family:
        "Cascadia Code",
        "Fira Code",
        Consolas,
        monospace;

    font-size: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    word-break: break-word;

}

.console-line {

    white-space: pre-wrap;

}

.normal {

    color: #cdd6f4;

}

.system {

    color: #6c7086;

}

.error {

    color: #f38ba8;

}

.input-output {

    color: #a6e3a1;

}


/* =========================================================
   CONSOLE INPUT
========================================================= */

.input-area {

    display: none;

    padding: 9px 13px;

    border-top: 1px solid #313244;

    background: #181825;

}

.input-row {

    display: flex;

    align-items: center;

    gap: 8px;

}

.input-prompt {

    color: #89b4fa;

    font-family:
        "Cascadia Code",
        Consolas,
        monospace;

    white-space: nowrap;

}

#consoleInput {

    flex: 1;

    min-width: 0;

    padding: 7px 9px;

    border: 1px solid #45475a;

    border-radius: 5px;

    outline: none;

    background: #11111b;

    color: #a6e3a1;

    font-family:
        "Cascadia Code",
        Consolas,
        monospace;

    font-size: 14px;

}

#consoleInput:focus {

    border-color: #89b4fa;

}


/* =========================================================
   TURTLE
========================================================= */

.turtle-view {

    position: relative;

    align-items: center;

    justify-content: center;

    background: #11111b;

}


/*
 * Two canvas layers:
 *
 * Bottom = drawing
 * Top    = turtle
 *
 * This prevents old turtle sprites
 * from being left behind.
 */

.turtle-stage {

    position: relative;

    width: 700px;

    height: 500px;

    max-width: 95%;

    max-height: 95%;

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);

}

.turtle-stage canvas {

    position: absolute;

    left: 0;

    top: 0;

    width: 100%;

    height: 100%;

}

#turtleDrawingCanvas {

    background: white;

}

#turtleCanvas {

    pointer-events: none;

}


/* =========================================================
   GENERAL CANVAS
========================================================= */

.canvas-view {

    position: relative;

    align-items: center;

    justify-content: center;

    background: #11111b;

}

#pythonCanvas {

    background: white;

    max-width: 95%;

    max-height: 95%;

    box-shadow:
        0 10px 35px rgba(0,0,0,.4);

}


/* =========================================================
   WEB
========================================================= */

.web-view {

    background: white;

}

#webFrame {

    width: 100%;

    height: 100%;

    border: 0;

    background: white;

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 800px) {

    body {

        overflow: auto;

    }

    .workspace {

        height: calc(100vh - 58px);

        grid-template-columns: 1fr;

        grid-template-rows: 1fr 1fr;

    }

    .panel + .panel {

        border-left: 0;

        border-top: 1px solid #313244;

    }

    .status {

        display: none;

    }

}

</style>
</head>


<body>


<!-- =========================================================
     TOP BAR
========================================================= -->

<header class="topbar">

    <div class="logo">
        PyLite
    </div>


    <div
        class="status"
        id="status"
    >
        Loading Python...
    </div>


    <button
        id="runButton"
        disabled
    >
        Run
    </button>


    <button
        id="stopButton"
        class="stop"
        disabled
    >
        Stop
    </button>


    <button
        id="clearButton"
        class="clear"
    >
        Clear
    </button>

</header>


<!-- =========================================================
     WORKSPACE
========================================================= -->

<main class="workspace">


    <!-- =====================================================
         PYTHON EDITOR
    ====================================================== -->

    <section class="panel">

        <div class="panel-header">
            Python
        </div>

        <div id="editor"></div>

    </section>


    <!-- =====================================================
         RIGHT PANEL
    ====================================================== -->

    <section class="panel right-panel">


        <!-- =================================================
             TABS
        ================================================== -->

        <div class="tabs">


            <div
                class="tab active"
                data-view="consoleView"
            >
                Console
            </div>


            <div
                class="tab"
                data-view="turtleView"
            >
                Turtle
            </div>


            <div
                class="tab"
                data-view="canvasView"
            >
                Canvas
            </div>


            <div
                class="tab"
                data-view="webView"
            >
                Web
            </div>


        </div>


        <!-- =================================================
             CONSOLE
        ================================================== -->

        <div
            class="view console-view active"
            id="consoleView"
        >

            <div id="console"></div>


            <div
                class="input-area"
                id="inputArea"
            >

                <div class="input-row">

                    <span
                        class="input-prompt"
                        id="inputPrompt"
                    >
                        &gt;&gt;&gt;
                    </span>


                    <input
                        id="consoleInput"
                        autocomplete="off"
                        spellcheck="false"
                    >

                </div>

            </div>

        </div>


        <!-- =================================================
             TURTLE
        ================================================== -->

        <div
            class="view turtle-view"
            id="turtleView"
        >

            <div class="turtle-stage">

                <!-- Drawing layer -->

                <canvas
                    id="turtleDrawingCanvas"
                    width="700"
                    height="500"
                ></canvas>


                <!-- Turtle layer -->

                <canvas
                    id="turtleCanvas"
                    width="700"
                    height="500"
                ></canvas>

            </div>

        </div>


        <!-- =================================================
             GENERAL CANVAS
        ================================================== -->

        <div
            class="view canvas-view"
            id="canvasView"
        >

            <canvas
                id="pythonCanvas"
                width="700"
                height="500"
            ></canvas>

        </div>


        <!-- =================================================
             WEB
        ================================================== -->

        <div
            class="view web-view"
            id="webView"
        >

            <iframe
                id="webFrame"
                sandbox="allow-scripts"
            ></iframe>

        </div>


    </section>

</main>


<script>


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let pyodide = null;

let editor = null;

let running = false;

let executionID = 0;

let inputResolver = null;


/* =========================================================
   DOM ELEMENTS
========================================================= */

const consoleElement =
    document.getElementById("console");


const consoleInput =
    document.getElementById("consoleInput");


const inputArea =
    document.getElementById("inputArea");


const inputPrompt =
    document.getElementById("inputPrompt");


const runButton =
    document.getElementById("runButton");


const stopButton =
    document.getElementById("stopButton");


const clearButton =
    document.getElementById("clearButton");


const status =
    document.getElementById("status");


/* =========================================================
   TABS
========================================================= */

document
    .querySelectorAll(".tab")
    .forEach(tab => {

        tab.addEventListener(
            "click",
            () => {


                document
                    .querySelectorAll(".tab")
                    .forEach(
                        t =>
                            t.classList.remove(
                                "active"
                            )
                    );


                document
                    .querySelectorAll(".view")
                    .forEach(
                        v =>
                            v.classList.remove(
                                "active"
                            )
                    );


                tab.classList.add(
                    "active"
                );


                const target =
                    document.getElementById(
                        tab.dataset.view
                    );


                target.classList.add(
                    "active"
                );


            }
        );

    });


/* =========================================================
   ACE THEME
========================================================= */

ace.define(
    "ace/theme/pylite",
    [
        "require",
        "exports",
        "module"
    ],
    function(
        require,
        exports,
        module
    ) {


        exports.isDark = true;

        exports.cssClass =
            "ace-pylite";


        exports.cssText = `

        .ace-pylite {
            background: #1e1e2e;
            color: #cdd6f4;
        }

        .ace-pylite .ace_gutter {
            background: #181825;
            color: #585b70;
        }

        .ace-pylite .ace_print-margin {
            background: #313244;
        }

        .ace-pylite .ace_cursor {
            color: #f5e0e0;
        }

        .ace-pylite
        .ace_marker-layer
        .ace_selection {
            background: #45475a;
        }

        .ace-pylite
        .ace_marker-layer
        .ace_active-line {
            background: #242435;
        }

        .ace-pylite .ace_gutter-active-line {
            background: #242435;
            color: #cdd6f4;
        }

        .ace-pylite .ace_keyword {
            color: #cba6f7;
        }

        .ace-pylite
        .ace_keyword.ace_operator {
            color: #89dceb;
        }

        .ace-pylite .ace_constant {
            color: #fab387;
        }

        .ace-pylite
        .ace_constant.ace_numeric {
            color: #fab387;
        }

        .ace-pylite .ace_string {
            color: #a6e3a1;
        }

        .ace-pylite .ace_comment {
            color: #6c7086;
            font-style: italic;
        }

        .ace-pylite
        .ace_support.ace_function {
            color: #89b4fa;
        }

        .ace-pylite
        .ace_entity.ace_name.ace_function {
            color: #89b4fa;
        }

        .ace-pylite
        .ace_support.ace_class {
            color: #f9e2af;
        }

        .ace-pylite
        .ace_entity.ace_name.ace_class {
            color: #f9e2af;
        }

        .ace-pylite .ace_variable {
            color: #cdd6f4;
        }

        .ace-pylite
        .ace_variable.ace_parameter {
            color: #f2cdcd;
        }

        .ace-pylite .ace_meta {
            color: #f9e2af;
        }

        .ace-pylite .ace_invalid {
            color: #f38ba8;
        }

        `;


        require(
            "ace/lib/dom"
        ).importCssString(
            exports.cssText,
            exports.cssClass
        );

    }
);


/* =========================================================
   CREATE EDITOR
========================================================= */

editor =
    ace.edit("editor");


editor.setTheme(
    "ace/theme/pylite"
);


editor.session.setMode(
    "ace/mode/python"
);


editor.setOptions({

    fontSize: "15px",

    showPrintMargin: false,

    showFoldWidgets: true,

    displayIndentGuides: true,

    highlightActiveLine: true,

    highlightSelectedWord: true,

    tabSize: 4,

    useSoftTabs: true,

    enableBasicAutocompletion: true,

    enableLiveAutocompletion: true,

    enableSnippets: true,

    behavioursEnabled: true,

    wrap: false

});


/* =========================================================
   AUTOCOMPLETE
========================================================= */

const pythonKeywords = [

    "and",
    "as",
    "assert",
    "async",
    "await",
    "break",
    "case",
    "class",
    "continue",
    "def",
    "del",
    "elif",
    "else",
    "except",
    "finally",
    "for",
    "from",
    "global",
    "if",
    "import",
    "in",
    "is",
    "lambda",
    "None",
    "nonlocal",
    "not",
    "or",
    "pass",
    "raise",
    "return",
    "True",
    "try",
    "type",
    "while",
    "with",
    "yield"

];


const pythonBuiltins = [

    "abs",
    "all",
    "any",
    "bool",
    "bytes",
    "callable",
    "chr",
    "dict",
    "dir",
    "enumerate",
    "filter",
    "float",
    "format",
    "getattr",
    "hasattr",
    "help",
    "id",
    "input",
    "int",
    "isinstance",
    "iter",
    "len",
    "list",
    "map",
    "max",
    "min",
    "next",
    "object",
    "open",
    "pow",
    "print",
    "range",
    "repr",
    "reversed",
    "round",
    "set",
    "sorted",
    "str",
    "sum",
    "tuple",
    "type",
    "zip"

];


const pythonModules = [

    "math",
    "random",
    "datetime",
    "json",
    "os",
    "sys",
    "time",
    "statistics",
    "re",
    "collections",
    "itertools",
    "functools",
    "decimal",
    "fractions",
    "pathlib",
    "turtle"

];


const pythonCompleter = {

    identifierRegexps: [
        /[a-zA-Z_][a-zA-Z0-9_]*/
    ],


    getCompletions:
    function(
        editor,
        session,
        pos,
        prefix,
        callback
    ) {


        const results = [];


        pythonKeywords.forEach(
            word => {

                results.push({

                    caption: word,

                    value: word,

                    meta: "keyword",

                    score: 900

                });

            }
        );


        pythonBuiltins.forEach(
            word => {

                results.push({

                    caption: word,

                    value: word,

                    meta: "builtin",

                    score: 800

                });

            }
        );


        pythonModules.forEach(
            word => {

                results.push({

                    caption: word,

                    value: word,

                    meta: "module",

                    score: 700

                });

            }
        );


        const code =
            editor.getValue();


        const definitions =
            code.matchAll(
                /\b(?:def|class)\s+([A-Za-z_]\w*)/g
            );


        for (
            const match of definitions
        ) {

            results.push({

                caption: match[1],

                value: match[1],

                meta: "defined",

                score: 950

            });

        }


        const variables =
            code.matchAll(
                /\b([A-Za-z_]\w*)\s*=/g
            );


        for (
            const match of variables
        ) {

            results.push({

                caption: match[1],

                value: match[1],

                meta: "variable",

                score: 850

            });

        }


        callback(
            null,
            results
        );

    }

};


const langTools =
    ace.require(
        "ace/ext/language_tools"
    );


langTools.addCompleter(
    pythonCompleter
);


/* =========================================================
   CONSOLE
========================================================= */

function clearConsole() {

    consoleElement.innerHTML = "";

}


function writeConsole(
    text,
    type = "normal"
) {

    const line =
        document.createElement("div");


    line.className =
        "console-line " + type;


    line.textContent =
        text;


    consoleElement.appendChild(
        line
    );


    consoleElement.scrollTop =
        consoleElement.scrollHeight;

}


function writeConsoleLine(
    text = "",
    type = "normal"
) {

    writeConsole(
        text,
        type
    );

}


/* =========================================================
   CONSOLE INPUT
========================================================= */

function requestInput(
    promptText
) {

    return new Promise(
        resolve => {

            inputResolver =
                resolve;


            inputPrompt.textContent =
                promptText || ">>>";


            inputArea.style.display =
                "block";


            consoleInput.value =
                "";


            consoleInput.focus();

        }
    );

}


function finishInput() {

    inputArea.style.display =
        "none";

}


consoleInput.addEventListener(
    "keydown",
    event => {


        if (
            event.key !== "Enter"
        ) {

            return;

        }


        const value =
            consoleInput.value;


        writeConsole(
            value,
            "input-output"
        );


        finishInput();


        if (
            inputResolver
        ) {

            const resolver =
                inputResolver;


            inputResolver =
                null;


            resolver(value);

        }

    }
);


/* =========================================================
   TURTLE CANVASES
========================================================= */

const turtleDrawingCanvas =
    document.getElementById(
        "turtleDrawingCanvas"
    );


const turtleDrawingCtx =
    turtleDrawingCanvas.getContext(
        "2d"
    );


const turtleCanvas =
    document.getElementById(
        "turtleCanvas"
    );


const turtleCtx =
    turtleCanvas.getContext(
        "2d"
    );


/* =========================================================
   GENERAL CANVAS
========================================================= */

const pythonCanvas =
    document.getElementById(
        "pythonCanvas"
    );


const pythonCtx =
    pythonCanvas.getContext(
        "2d"
    );


function clearPythonCanvas() {

    pythonCtx.fillStyle =
        "white";


    pythonCtx.fillRect(
        0,
        0,
        pythonCanvas.width,
        pythonCanvas.height
    );

}


clearPythonCanvas();


/* =========================================================
   BROWSER TURTLE
========================================================= */

class BrowserTurtle {


    constructor() {

        this.x =
            turtleDrawingCanvas.width / 2;


        this.y =
            turtleDrawingCanvas.height / 2;


        this.angle = 0;


        this.pen = true;


        this.colorValue =
            "#000000";


        this.widthValue = 1;


        this.visible = true;


        this.speedValue = 0;


        this.resetCanvas();


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       RESET DRAWING
    ----------------------------------------------------- */

    resetCanvas() {


        turtleDrawingCtx.clearRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        turtleDrawingCtx.fillStyle =
            "white";


        turtleDrawingCtx.fillRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        this.clearTurtleOverlay();

    }


    /* -----------------------------------------------------
       CLEAR TURTLE ONLY
    ----------------------------------------------------- */

    clearTurtleOverlay() {

        turtleCtx.clearRect(
            0,
            0,
            turtleCanvas.width,
            turtleCanvas.height
        );

    }


    /* -----------------------------------------------------
       FORWARD
    ----------------------------------------------------- */

    forward(distance) {


        const radians =
            this.angle *
            Math.PI /
            180;


        const nx =
            this.x +
            Math.cos(radians) *
            distance;


        const ny =
            this.y -
            Math.sin(radians) *
            distance;


        if (this.pen) {


            turtleDrawingCtx.beginPath();


            turtleDrawingCtx.moveTo(
                this.x,
                this.y
            );


            turtleDrawingCtx.lineTo(
                nx,
                ny
            );


            turtleDrawingCtx.strokeStyle =
                this.colorValue;


            turtleDrawingCtx.lineWidth =
                this.widthValue;


            turtleDrawingCtx.lineCap =
                "round";


            turtleDrawingCtx.stroke();

        }


        this.x = nx;

        this.y = ny;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       BACKWARD
    ----------------------------------------------------- */

    backward(distance) {

        this.forward(
            -distance
        );

    }


    /* -----------------------------------------------------
       LEFT
    ----------------------------------------------------- */

    left(degrees) {

        this.angle +=
            degrees;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       RIGHT
    ----------------------------------------------------- */

    right(degrees) {

        this.angle -=
            degrees;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       PEN UP
    ----------------------------------------------------- */

    penup() {

        this.pen = false;

    }


    /* -----------------------------------------------------
       PEN DOWN
    ----------------------------------------------------- */

    pendown() {

        this.pen = true;

    }


    /* -----------------------------------------------------
       GOTO
    ----------------------------------------------------- */

    goto(x, y) {


        const nx =
            turtleDrawingCanvas.width / 2 +
            Number(x);


        const ny =
            turtleDrawingCanvas.height / 2 -
            Number(y);


        if (this.pen) {


            turtleDrawingCtx.beginPath();


            turtleDrawingCtx.moveTo(
                this.x,
                this.y
            );


            turtleDrawingCtx.lineTo(
                nx,
                ny
            );


            turtleDrawingCtx.strokeStyle =
                this.colorValue;


            turtleDrawingCtx.lineWidth =
                this.widthValue;


            turtleDrawingCtx.stroke();

        }


        this.x = nx;

        this.y = ny;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       SET X
    ----------------------------------------------------- */

    setx(x) {

        this.goto(
            x,
            this.gety()
        );

    }


    /* -----------------------------------------------------
       SET Y
    ----------------------------------------------------- */

    sety(y) {

        this.goto(
            this.getx(),
            y
        );

    }


    /* -----------------------------------------------------
       GET X
    ----------------------------------------------------- */

    getx() {

        return (
            this.x -
            turtleDrawingCanvas.width / 2
        );

    }


    /* -----------------------------------------------------
       GET Y
    ----------------------------------------------------- */

    gety() {

        return (
            turtleDrawingCanvas.height / 2 -
            this.y
        );

    }


    /* -----------------------------------------------------
       HOME
    ----------------------------------------------------- */

    home() {

        this.goto(
            0,
            0
        );


        this.angle = 0;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       CIRCLE
    ----------------------------------------------------- */

    circle(
        radius,
        extent = 360
    ) {


        const steps =
            Math.max(
                20,
                Math.floor(
                    Math.abs(extent)
                )
            );


        const step =
            extent / steps;


        const distance =
            2 *
            Math.PI *
            Math.abs(radius) *
            Math.abs(step) /
            360;


        for (
            let i = 0;
            i < steps;
            i++
        ) {


            this.left(step);


            this.forward(
                distance
            );

        }

    }


    /* -----------------------------------------------------
       COLOR
    ----------------------------------------------------- */

    color(value) {

        this.colorValue =
            String(value);

    }


    pencolor(value) {

        this.colorValue =
            String(value);

    }


    /* -----------------------------------------------------
       PEN SIZE
    ----------------------------------------------------- */

    pensize(value) {

        this.widthValue =
            Number(value);

    }


    width(value) {

        this.widthValue =
            Number(value);

    }


    /* -----------------------------------------------------
       CLEAR
    ----------------------------------------------------- */

    clear() {


        turtleDrawingCtx.clearRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        turtleDrawingCtx.fillStyle =
            "white";


        turtleDrawingCtx.fillRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       FULL RESET
    ----------------------------------------------------- */

    reset() {


        this.x =
            turtleDrawingCanvas.width / 2;


        this.y =
            turtleDrawingCanvas.height / 2;


        this.angle = 0;


        this.pen = true;


        this.colorValue =
            "#000000";


        this.widthValue = 1;


        this.visible = true;


        this.speedValue = 0;


        /*
         * Completely clear BOTH layers.
         */

        turtleDrawingCtx.clearRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        turtleCtx.clearRect(
            0,
            0,
            turtleCanvas.width,
            turtleCanvas.height
        );


        turtleDrawingCtx.fillStyle =
            "white";


        turtleDrawingCtx.fillRect(
            0,
            0,
            turtleDrawingCanvas.width,
            turtleDrawingCanvas.height
        );


        /*
         * Draw exactly ONE turtle.
         */

        this.drawTurtle();

    }


    /* -----------------------------------------------------
       SPEED
    ----------------------------------------------------- */

    speed(value) {

        this.speedValue =
            Number(value);

    }


    /* -----------------------------------------------------
       HIDE
    ----------------------------------------------------- */

    hideturtle() {

        this.visible = false;


        this.clearTurtleOverlay();

    }


    /* -----------------------------------------------------
       SHOW
    ----------------------------------------------------- */

    showturtle() {

        this.visible = true;


        this.drawTurtle();

    }


    /* -----------------------------------------------------
       DRAW TURTLE
    ----------------------------------------------------- */

    drawTurtle() {


        /*
         * THIS IS THE IMPORTANT PART.
         *
         * The turtle canvas is ONLY the
         * turtle overlay.
         *
         * Every time the turtle moves,
         * we erase the old turtle first.
         *
         * The drawing canvas is untouched.
         */

        this.clearTurtleOverlay();


        if (!this.visible) {

            return;

        }


        turtleCtx.save();


        turtleCtx.translate(
            this.x,
            this.y
        );


        turtleCtx.rotate(
            -this.angle *
            Math.PI /
            180
        );


        turtleCtx.beginPath();


        turtleCtx.moveTo(
            15,
            0
        );


        turtleCtx.lineTo(
            -9,
            -8
        );


        turtleCtx.lineTo(
            -9,
            8
        );


        turtleCtx.closePath();


        turtleCtx.fillStyle =
            "#20a0ff";


        turtleCtx.fill();


        turtleCtx.strokeStyle =
            "#11111b";


        turtleCtx.lineWidth =
            1.5;


        turtleCtx.stroke();


        turtleCtx.restore();

    }

}

/* =========================================================
   INPUT TRANSFORMATION
========================================================= */

function transformInput(
    code
) {


    /*
     * Browser input() is asynchronous.
     *
     * Replace:
     *
     * input("Name: ")
     *
     * with:
     *
     * await _pylite_input("Name: ")
     */

    return code.replace(
        /\binput\s*\(/g,
        "await _pylite_input("
    );

}


/* =========================================================
   RUN PYTHON
========================================================= */

async function runPython() {


    if (
        !pyodide ||
        running
    ) {

        return;

    }


    /*
     * -----------------------------------------------
     * CLEAR EVERYTHING FROM PREVIOUS RUN
     * -----------------------------------------------
     */


    clearConsole();


    finishInput();


    clearPythonCanvas();


    /*
     * IMPORTANT:
     *
     * Completely reset the Turtle.
     *
     * This removes:
     *
     * - previous lines
     * - previous turtle
     * - previous position
     * - previous colour
     * - previous pen size
     *
     * and creates exactly ONE new turtle.
     */


    if (
        window.pyLiteTurtle
    ) {

        window.pyLiteTurtle.reset();

    }


    running = true;


    const id =
        ++executionID;


    runButton.disabled =
        true;


    stopButton.disabled =
        false;


    writeConsoleLine(
        ">>> Running...",
        "system"
    );


    const code =
        editor.getValue();


    const start =
        performance.now();


    try {


        const transformed =
            transformInput(
                code
            );


        await pyodide.runPythonAsync(
            transformed
        );


        if (
            id !== executionID
        ) {

            return;

        }


        const elapsed =
            (
                performance.now() -
                start
            ).toFixed(2);


        writeConsoleLine(
            "",
            "normal"
        );


        writeConsoleLine(
            `>>> Finished in ${elapsed} ms`,
            "system"
        );


    }

    catch (error) {


        if (
            id === executionID
        ) {


            writeConsoleLine(
                "",
                "normal"
            );


            writeConsoleLine(
                String(error),
                "error"
            );

        }

    }

    finally {


        if (
            id === executionID
        ) {


            running = false;


            runButton.disabled =
                false;


            stopButton.disabled =
                true;

        }

    }

}


/* =========================================================
   STOP
========================================================= */

function stopPython() {


    executionID++;


    running = false;


    finishInput();


    runButton.disabled =
        false;


    stopButton.disabled =
        true;


    writeConsoleLine(
        "",
        "normal"
    );


    writeConsoleLine(
        ">>> Execution stopped.",
        "error"
    );

}
